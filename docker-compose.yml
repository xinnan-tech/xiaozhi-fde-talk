services:
  # ================================================================
  # FunASR 语音识别服务（CPU 推理）
  # 首次启动会自动下载模型，下载完成后监听 10095 端口提供 WebSocket ASR 服务
  # ================================================================
  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: funasr_server
    restart: unless-stopped
    privileged: true
    ports:
      - "10096:10095"
    volumes:
      - ./backend/models/funasr-runtime-resources:/workspace/models
    # 健康检查：TCP 10095 在容器内可达即视为 ASR 服务就绪——脚本内是后台
    # bash + tail -f，主进程退出码恒 0，docker 看不到真服务状态。显式建
    # healthcheck 让 app depends_on 用 service_healthy 等真 ready，避免
    # cold start 阶段 app 已启但 funasr 模型未下载完连不上导致死循环重启。
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/10095 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    # 使用分号隔离命令，确保 cd 和 touch 在主 shell 中按顺序生效
    command: >
      bash -c "cd FunASR/runtime;
      touch log.txt;
      bash run_server_2pass.sh
      --download-model-dir /workspace/models
      --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      --model-dir iic/SenseVoiceSmall-onnx
      --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      --itn-dir thuduj12/fst_itn_zh
      --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
      sleep 1;
      tail -f log.txt"

  # ================================================================
  # 小智方糖主应用（FastAPI + 前端 SPA 单镜像）
  # ENV=dev + SQLite 是当前 compose 默认值；上公网必须改 ENV=prod
  # 并把 DB_URL 换成 MySQL/PostgreSQL，否则 Settings._validate_prod 拒启。
  # ================================================================
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xiaozhi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=dev
      - DB_URL=sqlite+aiosqlite:////app/data/xiaozhi_fde_talk.db
      - LOG_LEVEL=INFO
      - SERVE_FRONTEND=true
      - ASR_WS_URL=ws://funasr:10095
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      # 默认单 worker：_revoked_refresh_jtis、RateLimiter._buckets、
      # config_store 缓存等模块级单例在多 worker 间不共享；改密 / logout 后
      # 旧 token 跨 worker 仍能刷 access，限流桶全局计数翻倍。当前实现留
      # 单 worker 默认；后续若换 Redis 共享撤销表与限流，可按 CPU 核数上调。
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    volumes:
      - app_data:/app/data
      - app_exports:/app/exports
    depends_on:
      funasr:
        condition: service_healthy
    healthcheck:
      # /health 是只读端点，不依赖 DB 写；用于容器健康检查
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 60s 不够模型首冷启下载；funasr 模型拉满可达 90s+，app 启动前需
      # 等 funasr 真 ready（service_healthy 兜底）。app 自己冷启 5s 即可。
      start_period: 30s

volumes:
  app_data:
  app_exports: