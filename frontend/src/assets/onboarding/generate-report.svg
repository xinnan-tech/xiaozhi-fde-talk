<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="doc-bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f0f7ff" />
                            <stop offset="100%" stop-color="#e0edfc" />
                        </linearGradient>
                        <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#d0e3ff" />
                        </linearGradient>
                        <linearGradient id="blue-box-4" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1166ff" />
                            <stop offset="100%" stop-color="#0044cc" />
                        </linearGradient>
                        <linearGradient id="line-blue-4" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#b3d4ff" />
                            <stop offset="100%" stop-color="#88b8ff" />
                        </linearGradient>
                        <linearGradient id="download-btn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#66dd33" />
                            <stop offset="100%" stop-color="#22aa00" />
                        </linearGradient>
                        <filter id="shadow-doc-4" x="-10%" y="-10%" width="130%" height="130%">
                            <feDropShadow dx="5" dy="15" stdDeviation="10" flood-color="#a0c4ff" flood-opacity="0.3"/>
                        </filter>
                        <filter id="shadow-btn-4" x="-20%" y="-20%" width="150%" height="150%">
                            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#22aa00" flood-opacity="0.4"/>
                        </filter>
                        <filter id="inner-glow-4">
                             <feOffset dx="-1" dy="-1"/>
                            <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                            <feFlood flood-color="white" flood-opacity="0.9" result="color"/>
                            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                        </filter>
                    </defs>

                    <!-- Main Document Base with Folded Corner -->
                    <g filter="url(#shadow-doc-4)">
                        <path d="M30,35 a15,15 0 0 1 15,-15 h60 l45,45 v90 a15,15 0 0 1 -15,15 h-90 a15,15 0 0 1 -15,-15 z" fill="url(#doc-bg-4)" filter="url(#inner-glow-4)"/>
                        <!-- Folded Corner -->
                        <path d="M105,20 v30 a15,15 0 0 0 15,15 h30 z" fill="url(#fold-grad)" opacity="0.8"/>
                    </g>

                    <!-- Content -->
                    <g transform="translate(50, 60)">
                        <rect x="0" y="0" width="18" height="18" rx="4" fill="url(#blue-box-4)" />
                        <rect x="28" y="5" width="20" height="8" rx="4" fill="url(#line-blue-4)" />
                        
                        <rect x="0" y="32" width="70" height="8" rx="4" fill="url(#line-blue-4)" />
                        <rect x="0" y="56" width="50" height="8" rx="4" fill="url(#line-blue-4)" />
                        <rect x="0" y="80" width="40" height="8" rx="4" fill="url(#line-blue-4)" />
                    </g>

                    <!-- Download Button Overlay -->
                    <g transform="translate(100, 120)" filter="url(#shadow-btn-4)">
                        <circle cx="33" cy="33" r="33" fill="url(#download-btn-bg)" />
                        <!-- Download Arrow Icon -->
                        <g transform="translate(18, 15)" fill="white">
                            <rect x="11" y="2" width="8" height="16" />
                            <path d="M5,18 L15,28 L25,18 Z" />
                            <rect x="5" y="31" width="20" height="4" rx="1.5" />
                        </g>
                    </g>
                </svg>