<svg viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bubble-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e6f0ff" />
                            <stop offset="100%" stop-color="#ccdbff" />
                        </linearGradient>
                        <linearGradient id="bubble-green" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#bdfa9d" />
                            <stop offset="100%" stop-color="#8ceb5b" />
                        </linearGradient>
                        <linearGradient id="line-blue-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#5599ff" />
                            <stop offset="100%" stop-color="#3388ff" />
                        </linearGradient>
                        <linearGradient id="line-blue-light" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#99c2ff" />
                            <stop offset="100%" stop-color="#88b8ff" />
                        </linearGradient>
                        <filter id="shadow-bubble" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#a0c4ff" flood-opacity="0.3"/>
                        </filter>
                        <filter id="inner-glow-blue">
                            <feOffset dx="-1" dy="-1"/>
                            <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                            <feFlood flood-color="white" flood-opacity="0.8" result="color"/>
                            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                        </filter>
                        <filter id="inner-glow-green">
                            <feOffset dx="-1" dy="-1"/>
                            <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                            <feFlood flood-color="white" flood-opacity="0.6" result="color"/>
                            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                        </filter>
                    </defs>

                    <!-- Top Blue Text Bubble -->
                    <g transform="translate(60, 20)" filter="url(#shadow-bubble)">
                        <path d="M15,0 h90 a15,15 0 0 1 15,15 v30 a15,15 0 0 1 -15,15 h-80 l-10,12 v-12 a15,15 0 0 1 -15,-15 v-30 a15,15 0 0 1 15,-15 z" 
                              fill="url(#bubble-blue)" filter="url(#inner-glow-blue)"/>
                        <!-- Lines -->
                        <rect x="18" y="18" width="75" height="6" rx="3" fill="url(#line-blue-dark)" />
                        <rect x="18" y="32" width="50" height="6" rx="3" fill="url(#line-blue-light)" />
                    </g>

                    <!-- Bottom Green Voice Bubble -->
                    <g transform="translate(40, 90)" filter="url(#shadow-bubble)">
                        <path d="M15,0 h75 a15,15 0 0 1 15,15 v25 a15,15 0 0 1 -15,15 h-65 l-10,12 v-12 a15,15 0 0 1 -15,-15 v-25 a15,15 0 0 1 15,-15 z" 
                              fill="url(#bubble-green)" filter="url(#inner-glow-green)"/>
                        
                        <!-- Voice Waveform (Green Bubble) -->
                        <g transform="translate(12, 10)" fill="#339900" opacity="0.7">
                            <rect x="0" y="12" width="3" height="10" rx="1.5" />
                            <rect x="6" y="8" width="3" height="18" rx="1.5" />
                            <rect x="12" y="14" width="3" height="6" rx="1.5" />
                            <rect x="18" y="4" width="3" height="26" rx="1.5" />
                            <rect x="24" y="10" width="3" height="14" rx="1.5" />
                            <rect x="30" y="2" width="3" height="30" rx="1.5" />
                            <rect x="36" y="10" width="3" height="14" rx="1.5" />
                            <rect x="42" y="5" width="3" height="24" rx="1.5" />
                            <rect x="48" y="12" width="3" height="10" rx="1.5" />
                            <rect x="54" y="16" width="3" height="2" rx="1.5" />
                            <rect x="60" y="8" width="3" height="18" rx="1.5" />
                            <rect x="66" y="12" width="3" height="10" rx="1.5" />
                        </g>
                    </g>

                    <!-- Faded Waveform Outside -->
                    <g transform="translate(155, 105)" fill="#aaccff" opacity="0.6">
                        <rect x="0" y="8" width="3" height="12" rx="1.5" />
                        <rect x="6" y="2" width="3" height="24" rx="1.5" />
                        <rect x="12" y="10" width="3" height="8" rx="1.5" />
                        <rect x="18" y="0" width="3" height="28" rx="1.5" />
                        <rect x="24" y="6" width="3" height="16" rx="1.5" />
                        <rect x="30" y="12" width="3" height="4" rx="1.5" />
                    </g>
                </svg>