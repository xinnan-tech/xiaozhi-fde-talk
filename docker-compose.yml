services:
  # ================================================================
  # FunASR 语音识别服务（CPU 推理）
  # 首次启动会自动下载模型，下载完成后监听 10095 端口提供 WebSocket ASR 服务
  # ================================================================
  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: funasr_server
    restart: unless-stopped
    privileged: true
    ports:
      - "10096:10095"
    volumes:
      - ./backend/models/funasr-runtime-resources:/workspace/models
    # 健康检查：TCP 10095 在容器内可达即视为 ASR 服务就绪——脚本内是后台
    # bash + tail -f，主进程退出码恒 0，docker 看不到真服务状态。显式建
    # healthcheck 让 app depends_on 用 service_healthy 等真 ready，避免
    # cold start 阶段 app 已启但 funasr 模型未下载完连不上导致死循环重启。
    # 用 bash -c 包一层：CMD-SHELL 默认走 /bin/sh（dash），不支持 bash 专有
    # 的 /dev/tcp 重定向，直接写会一直 "cannot create /dev/tcp"。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10095 && echo -e \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    # 使用分号隔离命令，确保 cd 和 touch 在主 shell 中按顺序生效
    # 命令参数跟仓库根 docs/funasr.md 文档里"独立部署"那段的 docker run 行
    # 完全一致：punc-dir / lm-dir / itn-dir / hotword 全部显式传，避免跟
    # 镜像里脚本内置默认值有出入。原 compose 把 punc-dir 错写成了 LM 模型
    # 名 damo/speech_ngram_lm_zh-cn-ai-wesp-fst，漏了 lm-dir，C++ server
    # 拿 LM 模型当 punc 找 model_quant.onnx，启动即退。
    command: >
      bash -c "cd FunASR/runtime;
      touch log.txt;
      bash run_server_2pass.sh
      --download-model-dir /workspace/models
      --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      --model-dir iic/SenseVoiceSmall-onnx
      --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx
      --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx
      --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst
      --itn-dir thuduj12/fst_itn_zh
      --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
      sleep 1;
      tail -f log.txt"

  # ================================================================
  # 小智方糖主应用（FastAPI + 前端 SPA 单镜像）
  # 直接拉 GHCR 上的 server-app 镜像（CI 在 v*.*.* tag 推送时自动构建发布）。
  # 如需本地编译新镜像，参见 docs/docker-build.md。
  #
  # 端口：8848（HTTPS 主服务，语音 WebSocket、REST、SPA 静态托管）
  #       与 dev 环境 Vite dev server 端口保持一致，浏览器地址栏统一
  #
  # 证书：./frontend/src/certs 目录直接挂进容器，跟 Vite dev 用同一份；
  # 改证书不用重打镜像，本机保存即生效。
  #
  # 数据：./backend/data 直接挂进容器，SQLite 文件跟 dev 共用，
  # 可直接 sqlite3 ./backend/data/xiaozhi_fde_talk.db 进去查。
  #
  # ENV=dev + SQLite 是当前 compose 默认值；上公网必须改 ENV=prod
  # 并把 DB_URL 换成 MySQL/PostgreSQL，否则 Settings._validate_prod 拒启。
  # ================================================================
  app:
    # 本地编译模式：Dockerfile 在仓库根 Dockerfile-server。改完前端源码/前端
    # env 文件后跑 `docker compose build app --no-cache` 再 `up -d app` 即生效。
    # 编译产物会覆盖原 GHCR 镜像名（同 image: 行 tag），保证 funasr 容器
    # depends_on 的 service_healthy 链路不变。
    image: ghcr.io/xinnan-tech/xiaozhi-fde-talk:server-app_latest
    build:
      context: .
      dockerfile: Dockerfile-server
      args:
        # CI 默认值；fork 后改自己的仓库地址。
        SERVER_BASE_REGISTRY: ghcr.io/xinnan-tech
        SERVER_BASE_TAG: server-base
    container_name: xiaozhi_app
    restart: unless-stopped
    ports:
      - "8848:8848"
    environment:
      - HOST=0.0.0.0
      - HTTPS_PORT=8848
      - SSL_KEYFILE=/app/certs/localhost-key.pem
      - SSL_CERTFILE=/app/certs/localhost.pem
      - ENV=dev
      - DB_URL=sqlite+aiosqlite:////app/data/xiaozhi_fde_talk.db
      - LOG_LEVEL=INFO
      - SERVE_FRONTEND=true
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # 默认单 worker：_revoked_refresh_jtis、RateLimiter._buckets、
      # config_store 缓存等模块级单例在多 worker 间不共享；改密 / logout 后
      # 旧 token 跨 worker 仍能刷 access，限流桶全局计数翻倍。当前实现留
      # 单 worker 默认；后续若换 Redis 共享撤销表与限流，可按 CPU 核数上调。
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    volumes:
      # 证书目录：直接挂前端 dev 证书目录
      # 容器内 /app/certs/{localhost,localhost-key}.pem 来自本机 frontend/src/certs/
      # 改证书不用重打镜像；生产换证书时改成你自己的证书目录路径
      - ./frontend/src/certs:/app/certs:ro
      # SQLite 数据：直接挂本机 backend/data
      - ./backend/data:/app/data
    depends_on:
      funasr:
        condition: service_healthy
    healthcheck:
      # /health 是只读端点，不依赖 DB 写；用于容器健康检查。
      # 镜像只有 python（slim base），没装 wget / curl；用 python urllib 直
      # 接打本地 HTTPS，自签名证书要关掉校验链，否则会抛 SSLCertVerificationError。
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import ssl, urllib.request; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost:8848/health', context=ctx, timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      # 60s 不够模型首冷启下载；funasr 模型拉满可达 90s+，app 启动前需
      # 等 funasr 真 ready（service_healthy 兜底）。app 自己冷启 5s 即可。
      start_period: 30s