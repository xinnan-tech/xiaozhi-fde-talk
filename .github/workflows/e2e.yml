name: frontend-e2e

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - "docker-compose.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - "docker-compose.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Chromium system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          python-version: "3.11"
          activate-environment: xiaozhi-fde-talk

      - name: Install Python deps
        shell: bash -el {0}
        run: |
          conda activate xiaozhi-fde-talk
          pip install -r backend/requirements.txt

      - name: pnpm install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Start FunASR
        run: docker compose up -d funasr

      - name: Wait for FunASR
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/10096) 2>/dev/null; then
              echo "FunASR ready"
              exit 0
            fi
            echo "Waiting for FunASR... $i"
            sleep 5
          done
          echo "FunASR not ready in 5min"
          docker compose logs funasr
          exit 1

      - name: Run e2e tests
        run: pnpm --dir frontend run test:e2e
        env:
          CI: "true"
          # e2e 专属环境：开 allow_registration 让多 spec 注册普通用户；其余保持 dev 默认。
          APP_ENV: "test"

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7