name: frontend-e2e

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - "docker-compose.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
      - "docker-compose.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Chromium system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 \
            netcat-openbsd

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: pnpm install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Cache FunASR models
        uses: actions/cache@v4
        with:
          path: backend/models/funasr-runtime-resources
          # 镜像固定 funasr-runtime-sdk-online-cpu-0.1.12，run_server_2pass.sh
          # 锁死模型 revision；docker-compose.yml 的 6 个 --*-dir 即模型清单，
          # 变更即重生成 cache key。cache miss 走首次冷下载，下一步 timeout 兜底。
          key: ${{ runner.os }}-funasr-${{ hashFiles('docker-compose.yml') }}
          restore-keys: ${{ runner.os }}-funasr-

      - name: Start FunASR
        # cache miss 时冷启动：6 个模型 ~500MB-1GB，runner 带宽不稳时可达 10min+
        timeout-minutes: 12
        run: docker compose up -d funasr

      - name: Wait for FunASR
        run: |
          for i in $(seq 1 100); do
            if nc -z 127.0.0.1 10096 2>/dev/null; then
              echo "FunASR ready"
              exit 0
            fi
            echo "Waiting for FunASR... $i"
            sleep 5
          done
          echo "FunASR not ready in 8min20s"
          docker compose logs funasr
          exit 1

      - name: Run e2e tests
        run: pnpm --dir frontend run test:e2e
        env:
          CI: "true"
          PYTHONUNBUFFERED: "1"
          # e2e 专属环境：开 allow_registration 让多 spec 注册普通用户；其余保持 dev 默认。
          APP_ENV: "test"

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7