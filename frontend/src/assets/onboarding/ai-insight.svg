<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="doc-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="100%" stop-color="#f0f5ff" />
                        </linearGradient>
                        <linearGradient id="blue-dot-3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#5599ff" />
                            <stop offset="100%" stop-color="#2277ff" />
                        </linearGradient>
                        <linearGradient id="line-blue-3" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#cce0ff" />
                            <stop offset="100%" stop-color="#aaccff" />
                        </linearGradient>
                        <linearGradient id="green-check-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#66dd33" />
                            <stop offset="100%" stop-color="#22aa00" />
                        </linearGradient>
                        <linearGradient id="grey-check-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e0e5eb" />
                            <stop offset="100%" stop-color="#c0c5cb" />
                        </linearGradient>
                        <filter id="shadow-doc-3" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#a0c4ff" flood-opacity="0.25"/>
                        </filter>
                        <filter id="inner-bevel-3">
                            <feOffset dx="-2" dy="-2"/>
                            <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                            <feFlood flood-color="white" flood-opacity="1" result="color"/>
                            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                        </filter>
                    </defs>

                    <!-- Main Document Base -->
                    <rect x="25" y="20" width="160" height="135" rx="16" fill="url(#doc-bg-3)" filter="url(#shadow-doc-3) url(#inner-bevel-3)" stroke="#e8f0fe" stroke-width="2"/>

                    <!-- List Items -->
                    <g transform="translate(45, 45)">
                        <!-- Row 1 -->
                        <circle cx="8" cy="8" r="8" fill="url(#blue-dot-3)" />
                        <rect x="25" y="4" width="65" height="8" rx="4" fill="url(#line-blue-3)" />
                        <!-- Green Check -->
                        <g transform="translate(115, 0)">
                            <circle cx="10" cy="8" r="10" fill="url(#green-check-bg)" />
                            <path d="M6 8 L9 11 L15 5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>

                        <!-- Row 2 -->
                        <circle cx="8" cy="40" r="8" fill="url(#blue-dot-3)" />
                        <rect x="25" y="36" width="65" height="8" rx="4" fill="url(#line-blue-3)" />
                        <!-- Green Check -->
                        <g transform="translate(115, 32)">
                            <circle cx="10" cy="8" r="10" fill="url(#green-check-bg)" />
                            <path d="M6 8 L9 11 L15 5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>

                        <!-- Row 3 -->
                        <circle cx="8" cy="72" r="8" fill="url(#blue-dot-3)" />
                        <rect x="25" y="68" width="65" height="8" rx="4" fill="url(#line-blue-3)" />
                        <!-- Grey Check (Pending) -->
                        <g transform="translate(115, 64)">
                            <circle cx="10" cy="8" r="10" fill="url(#grey-check-bg)" />
                            <path d="M6 8 L9 11 L15 5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                    </g>
                </svg>