<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Top Face Gradients -->
                        <linearGradient id="bar-top" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6eb5ff" />
                            <stop offset="100%" stop-color="#4499ff" />
                        </linearGradient>
                        <!-- Left Face Gradients -->
                        <linearGradient id="bar-left" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#b8daff" />
                            <stop offset="100%" stop-color="#99c2ff" />
                        </linearGradient>
                        <!-- Right Face Gradients (Darker) -->
                        <linearGradient id="bar-right" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#3377ff" />
                            <stop offset="100%" stop-color="#e6f0ff" />
                        </linearGradient>
                        
                        <!-- Shadows -->
                        <filter id="chart-base-shadow">
                            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#a0c4ff" flood-opacity="0.3"/>
                        </filter>
                    </defs>

                    <!-- Base Rings/Planes -->
                    <g transform="translate(150, 160) scale(1, 0.4)" stroke="#cce0ff" stroke-width="2" fill="rgba(230, 240, 255, 0.3)" filter="url(#chart-base-shadow)">
                        <circle cx="0" cy="0" r="110" />
                        <circle cx="20" cy="10" r="70" fill="rgba(255,255,255,0.5)"/>
                        <circle cx="-30" cy="-10" r="50" fill="rgba(255,255,255,0.5)"/>
                    </g>

                    <g transform="translate(30, 40)">
                        <!-- Isometric Cube Constructor Macro (Simulated via paths) -->
                        
                        <!-- Bar 1 (Front Left, Shortest) -->
                        <g transform="translate(10, 80)">
                            <!-- Left Face -->
                            <polygon points="0,15 0,35 25,45 25,25" fill="url(#bar-left)" />
                            <!-- Right Face -->
                            <polygon points="25,25 25,45 50,35 50,15" fill="url(#bar-right)" />
                            <!-- Top Face -->
                            <polygon points="0,15 25,25 50,15 25,5" fill="url(#bar-top)" />
                        </g>

                        <!-- Bar 2 (Back Middle, Small) -->
                        <g transform="translate(80, 95) scale(0.6)">
                            <polygon points="0,20 0,40 15,48 15,28" fill="url(#bar-left)" />
                            <polygon points="15,28 15,48 30,40 30,20" fill="url(#bar-right)" />
                            <polygon points="0,20 15,28 30,20 15,12" fill="url(#bar-top)" />
                        </g>

                        <!-- Bar 3 (Back Left, Medium) -->
                        <g transform="translate(65, 30)">
                            <polygon points="0,20 0,90 20,100 20,30" fill="url(#bar-left)" />
                            <polygon points="20,30 20,100 40,90 40,20" fill="url(#bar-right)" />
                            <polygon points="0,20 20,30 40,20 20,10" fill="url(#bar-top)" />
                        </g>

                        <!-- Bar 4 (Front Middle, Medium-High) -->
                        <g transform="translate(125, 45)">
                            <polygon points="0,20 0,95 25,105 25,30" fill="url(#bar-left)" />
                            <polygon points="25,30 25,105 50,95 50,20" fill="url(#bar-right)" />
                            <polygon points="0,20 25,30 50,20 25,10" fill="url(#bar-top)" />
                        </g>
                        
                        <!-- Bar 5 (Back Right, Tiny) -->
                        <g transform="translate(105, 80) scale(0.5)">
                            <polygon points="0,20 0,60 15,68 15,28" fill="url(#bar-left)" />
                            <polygon points="15,28 15,68 30,60 30,20" fill="url(#bar-right)" />
                            <polygon points="0,20 15,28 30,20 15,12" fill="url(#bar-top)" />
                        </g>

                        <!-- Bar 6 (Front Right, Tallest) -->
                        <g transform="translate(180, 20)">
                            <polygon points="0,20 0,110 25,120 25,30" fill="url(#bar-left)" />
                            <polygon points="25,30 25,120 50,110 50,20" fill="url(#bar-right)" />
                            <polygon points="0,20 25,30 50,20 25,10" fill="url(#bar-top)" />
                        </g>
                    </g>
                </svg>